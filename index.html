<!DOCTYPE html><html lang="de">
    <head>  <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: arial, sans-serif;
                margin: 0;
                padding: 0;
                width: 100%;
                min-height: 100vh;
                background-image: url('Hintergrund2.jpg');
                background-repeat: no-repeat;
                background-position: bottom center;
                background-size: cover;
                background-attachment: fixed;
                display: flex;
                justify-content:center;
                align-items: flex-start;
            }
            .main-container {
                width:250px;
                min-height: auto;
                background-color: rgba(255,255,255,0.95);
                margin: 0 auto;
                padding: 30px, 30px, 10px, 30px;
                text-align: center;
                border-radius: 15px;
                box-shadow: 0 0px 25px rgba(0,0,0,0.15);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-sizing: border-box;

                background-image: url('Logo.webp');
                background-repeat: no-repeat;
                background-position: top left;
                background-size: 150px;
            }
            header {
                position: relative;
                margin-bottom: 30px;
            }
            .logo-wrapper {
              text-align: right;
              margin-bottom: 10px;
            }
            .logo-img {
                max-width: 150px;
                height: auto;
            }
            .profile-img {
                width: 200px;
                height: auto;
                border-radius: 8px;
                border: none;
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                margin-bottom: 15px;
                object-fit: contain;
                object-position: center;
            }
            h1 {
                font-size: 24px;
                margin: 0 0 5px 0;
                color: #333;
            }
            h3 {
                font-size: 16px;
                font-weight: normal;
                color: #666;
                margin: 0;
            }
            .company-name {

            font-weight: bold;
            margin-top: 20px;
            }
            .contact-info {
                margin: 20px 0;
                font-size: 14px;
            }
            .contact-info p {
                margin: 5px 0;
            }
            .qr-wrapper {
                width: 150px;
                height: auto;
            }
            .qr-img {
                width: 110px;
                height: auto;
            }
            .status-icons {
                font-size: 18px;
                color: #666;
                margin-top: 10px;
                display: flex;
                justify-content: center;
                gab: 15px;
                align-items: center;
            }
            .timestamp {
                font-size: 12px;
                color: #999;
                margin-left: 10px;
            }
            footer {
                margin-top: 40px;
                font-size: 12px;
                color: #888;
                border-top: 1px solid #eee;
                padding-top: 15px;
            }
            footer a {
                color: #888;
                text-decoration: none;
                margin: 0 5px;
            }
            @media (max-width: 600px) {
                .main-container {
                    margin: 10px auto;
                    padding: 20px;
                }
                h1 {font-size: 20px; }
                .profile-img {width 120px; height: 120px;}
            }
        
        </style>
        <title>Benas Danielaitis | Dein Energie-Experte </title>
    
</head>
<body><div class="main-container"> 
<header>
    
<div class="logo-wrapper">
    <img rsc="Hintergrund2.jpg" alt="Energiespardienst 24 Logo" class="logo-img"
</div>
<div class="profile-wrapper">
    <img src="Benas Bild.png" alt="Bild von Benas Danielaitis" class="profile-img">
    <h1>Benas Danielaitis</h1>
    <h3>Unabhängiger Fachberater für Energie & Tarifoptimierungen</h3>
</div></header>
<main>
<p class="company-name">Benas Leonas Danielaitis</p>
<div class="contact-info">
    <p>Telefon: +4915170392922</p>
    <p>E-Mail: benas.leonas.danielaitis1@gmail.com</p>
</div>
<div class="qr-wrapper">
    <img src="qr-code.png" alt="QR-Code zur Visitenkarte von Benas Danielaitis" class="qr-img">
</div></main>

        <footer>
            <p>&copy; 2026 Benas Danielaitis | <a href="#">Impressum</a> | <a href="#">Datenschutz</a></p>
        </footer> 
        </div>
